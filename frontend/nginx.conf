server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # SPA React (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite (cache long)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker Firebase (pas de cache)
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API vers Django
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Fichiers statiques Django (servis directement par Nginx)
    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Médias (servis directement par Nginx)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}