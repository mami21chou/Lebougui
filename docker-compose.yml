services:

  # ═══════════════════════════════════════════════════════════
  # MYSQL
  # ═══════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: lebugui_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:  
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backup_lebugui.sql:/docker-entrypoint-initdb.d/02-dump.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lebugui_net

  # ═══════════════════════════════════════════════════════════
  # IA (FastAPI + Whisper + CLIP)
  # ═══════════════════════════════════════════════════════════
  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    container_name: lebugui_ia
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lebugui_net

  # ═══════════════════════════════════════════════════════════
  # BACKEND (Django + Gunicorn)
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lebugui_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
      - ./secrets/firebase_key.json:/app/firebase_key.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      ia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lebugui_net

  # ═══════════════════════════════════════════════════════════
  # FRONTEND (Nginx + build Vite)
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DJANGO_URL: ${VITE_DJANGO_URL:-/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
    container_name: lebugui_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend/staticfiles:/usr/share/nginx/staticfiles:ro
      - ./backend/media:/usr/share/nginx/media:ro
    depends_on:
      - backend
    networks:
      - lebugui_net

volumes:
  mysql_data:

networks:
  lebugui_net:
    driver: bridge
